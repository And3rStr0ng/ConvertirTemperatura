<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Convertidor Temperatura</title>
</head>
<body>
    <div class="tarjeta">
        <h1>Convertidor de Temperatura</h1>
        <p>Ingrese la temperatura, seleccione las unidades y suba</p>
        
        <!-- Campo de entrada para el valor numérico -->
        <input type="number" id="input-valor" placeholder="0.00">

        <!-- Selector de unidad de origen -->
        <select id="select-origen">
            <option value="" disabled selected>De unidad</option>
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Kelvin">Kelvin</option>
        </select>

        <!-- Selector de unidad de destino -->
        <select id="select-destino">
            <option value="" disabled selected>A unidad</option>
            <option value="Celsius">Celsius</option>
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Kelvin">Kelvin</option>
        </select>

        <!-- Botón con el atributo disabled por defecto -->
        <button id="btn-convertir" disabled>Convertir</button>

        <!-- Contenedor para mostrar el resultado -->
        <div id="resultado"></div>
    </div>

    <script src="js/scrip.js"></script>
</body>
</html>
